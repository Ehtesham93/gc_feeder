plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    id 'maven-publish'
}

group = 'org.mahindradatahandler'
version = '1.0.0'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
}

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
    archiveClassifier = "sources"
}

publishing{
	publications {
		     mavenJava(MavenPublication) {
		     from components.java
		     artifact sourceJar
		     }
	}
}

dependencies {
    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is used by the application.
    implementation libs.guava
    implementation 'software.amazon.kinesis:amazon-kinesis-client:3.1.0'
    implementation 'software.amazon.awssdk:netty-nio-client:2.30.38'
    implementation 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.5.16'
    implementation 'org.xerial.snappy:snappy-java:1.1.10.7'
    implementation 'in.mahindra.infra.clickhousebucket.producer:ClickhouseBucketProducer:1.0-dist'
    implementation 'in.mahindra.infra.lognmetricswriter.observability:LogNMetricsWriter:1.0-dist'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    // implementation 'io.opentelemetry:opentelemetry-sdk:1.46.0'
    // implementation 'io.opentelemetry:opentelemetry-exporter-otlp-metrics:1.14.0'

    implementation 'io.prometheus:prometheus-metrics-core:1.3.1'
    implementation 'io.prometheus:prometheus-metrics-exporter-pushgateway:1.3.1'
    implementation 'redis.clients:jedis:5.0.2'
    implementation 'org.postgresql:postgresql:42.6.1'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'
    implementation 'org.codehaus.jackson:jackson-core-asl:1.9.13'
}

// Force resolution of AWS SDK components that contain USER_REGION field
configurations.all {
    resolutionStrategy {
        force 'software.amazon.awssdk:utils:2.25.64'
        force 'software.amazon.awssdk:annotations:2.25.64'
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.mahindradatahandler.DataReader'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.mahindradatahandler.DataReader'
        )
    }
}


task fatJar(type: Jar) {
    manifest {
        attributes 'Main-Class': 'org.mahindradatahandler.DataReader'
    }
    archiveBaseName = project.name + '-all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { 
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } 
    }
    from {
        sourceSets.main.output
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    with jar
}